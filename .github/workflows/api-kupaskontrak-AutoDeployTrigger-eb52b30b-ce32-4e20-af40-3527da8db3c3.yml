name: Trigger auto deployment for api-kupaskontrak

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/api-kupaskontrak-AutoDeployTrigger-eb52b30b-ce32-4e20-af40-3527da8db3c3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APIKUPASKONTRAK_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APIKUPASKONTRAK_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APIKUPASKONTRAK_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/server
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.APIKUPASKONTRAK_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APIKUPASKONTRAK_REGISTRY_PASSWORD }}
          containerAppName: api-kupaskontrak
          resourceGroup: rg-kupaskontrak
          imageToBuild: renhartoz/api-kupaskontrak:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


